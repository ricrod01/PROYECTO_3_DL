services:
  ml:
    build:
      context: .
      dockerfile: Dockerfile

    image: text-to-sql-ml:1.0
    container_name: text_to_sql_ml

    gpus: all

    volumes:
      - .:/workspace
      - hf_cache:/root/.cache/huggingface

    working_dir: /workspace/scripts

    environment:
      - PYTHONUNBUFFERED=1
      - TOKENIZERS_PARALLELISM=false

    stdin_open: true
    tty: true

    command: sleep infinity

  mysql:
    image: mysql:8.4.10
    container_name: text_to_sql_mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  hf_cache:

  mysql_data:
    external: true
    name: proyecto_3_dl_mysql_data